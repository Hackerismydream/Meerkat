[project]
name = "meerkat-backend"
version = "0.1.0"
description = "Meerkat live operations anomaly handling backend and agent capstone"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20.0",
    "fastapi>=0.115.0",
    "greenlet>=3.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "sqlalchemy>=2.0.30",
    "uvicorn[standard]>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
